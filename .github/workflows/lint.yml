name: lint

on:
  pull_request:
    paths:
      - "skills/**"
      - "agents/**"
      - "install.sh"
  push:
    branches:
      - main
      - master
    paths:
      - "skills/**"
      - "agents/**"
      - "install.sh"

jobs:
  validate-frontmatter:
    name: Validate SKILL.md frontmatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontmatter
        run: |
          errors=0
          for skill in skills/*/SKILL.md; do
            echo "Checking $skill..."

            # Extract frontmatter (between first two --- lines)
            frontmatter=$(sed -n '/^---$/,/^---$/p' "$skill" | sed '1d;$d')

            if [[ -z "$frontmatter" ]]; then
              echo "  ERROR: No YAML frontmatter found"
              errors=$((errors + 1))
              continue
            fi

            # Check for required fields
            name=$(echo "$frontmatter" | grep -E '^name:' || true)
            if [[ -z "$name" ]]; then
              echo "  ERROR: Missing 'name' field"
              errors=$((errors + 1))
            else
              echo "  name: OK"
            fi

            description=$(echo "$frontmatter" | grep -E '^description:' || true)
            if [[ -z "$description" ]]; then
              echo "  ERROR: Missing 'description' field"
              errors=$((errors + 1))
            else
              # Check description length (extract full multiline description)
              desc_text=$(sed -n '/^---$/,/^---$/p' "$skill" | sed '1d;$d' | sed -n '/^description:/,/^[a-z]/p' | sed '$d' | sed 's/^description: *>-\?//' | tr '\n' ' ' | sed 's/  */ /g' | xargs)
              desc_len=${#desc_text}
              if [[ $desc_len -gt 500 ]]; then
                echo "  WARNING: Description is $desc_len chars (recommended: under 500)"
              else
                echo "  description: OK ($desc_len chars)"
              fi
            fi

            # Check for personal path references
            if grep -qn '/Users/' "$skill"; then
              echo "  ERROR: Contains personal path references (/Users/...)"
              grep -n '/Users/' "$skill"
              errors=$((errors + 1))
            fi
          done

          if [[ $errors -gt 0 ]]; then
            echo ""
            echo "Found $errors error(s)"
            exit 1
          fi

          echo ""
          echo "All skills passed validation"

  validate-agents:
    name: Validate Claude Code subagent frontmatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check agents
        run: |
          errors=0
          shopt -s nullglob
          declare -A seen
          for agent in agents/*/*.md; do
            echo "Checking $agent..."
            if [[ "$(head -1 "$agent")" != "---" ]]; then
              echo "  ERROR: frontmatter must start on line 1"
              errors=$((errors + 1))
              continue
            fi
            fm=$(sed -n '2,/^---$/p' "$agent" | sed '$d')

            name=$(echo "$fm" | sed -n 's/^name: *//p')
            if [[ -z "$name" ]]; then
              echo "  ERROR: missing 'name'"
              errors=$((errors + 1))
            elif [[ "$name" == *:* || "$name" == -* ]]; then
              echo "  ERROR: name '$name' must not contain ':' or start with '-'"
              errors=$((errors + 1))
            elif [[ -n "${seen[$name]:-}" ]]; then
              echo "  ERROR: duplicate name '$name' (also in ${seen[$name]})"
              errors=$((errors + 1))
            else
              seen[$name]="$agent"
              echo "  name: OK ($name)"
            fi

            if ! echo "$fm" | grep -qE '^description: *\S'; then
              echo "  ERROR: missing 'description'"
              errors=$((errors + 1))
            fi

            model=$(echo "$fm" | sed -n 's/^model: *//p')
            if [[ -n "$model" && ! "$model" =~ ^(sonnet|opus|haiku|fable|inherit|claude-[a-z0-9.-]+)$ ]]; then
              echo "  ERROR: unknown model '$model'"
              errors=$((errors + 1))
            fi

            effort=$(echo "$fm" | sed -n 's/^effort: *//p')
            if [[ -n "$effort" && ! "$effort" =~ ^(low|medium|high|xhigh|max)$ ]]; then
              echo "  ERROR: unknown effort '$effort'"
              errors=$((errors + 1))
            fi
          done

          if [[ $errors -gt 0 ]]; then
            echo ""
            echo "Found $errors error(s)"
            exit 1
          fi
          echo ""
          echo "All agents passed validation"

  style:
    name: Check style rules in skills and agents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No em dashes or en dashes
        run: |
          if grep -rn -e $'\xe2\x80\x94' -e $'\xe2\x80\x93' skills/ agents/; then
            echo "ERROR: replace em/en dashes with a regular hyphen"
            exit 1
          fi
          echo "OK"

      - name: install.sh syntax
        run: bash -n install.sh
