name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create release with skill zips
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package skills
        run: |
          mkdir -p dist
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            echo "Packaging $skill_name..."
            (cd skills && zip -r "../dist/${skill_name}.zip" "$skill_name/")
          done
          for agents_dir in agents/*/; do
            [ -d "$agents_dir" ] || continue
            group=$(basename "$agents_dir")
            echo "Packaging Claude Code agents for $group..."
            (cd agents && zip -r "../dist/${group}-agents.zip" "$group/")
          done
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
